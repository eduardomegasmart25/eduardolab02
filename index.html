<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Frete Express</title>
    <style>
        /* --- ESTILOS GERAIS (CSS) --- */
        :root {
            --primary-color: #4e54c8;
            --secondary-color: #8f94fb;
            --accent-color: #ff6b6b;
            --text-color: #333;
            --bg-color: #f4f7f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- CARD PRINCIPAL --- */
        .calculator-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .calculator-card:hover {
            transform: translateY(-5px);
        }

        h1 {
            color: var(--text-color);
            margin-bottom: 10px;
            font-size: 24px;
        }

        p.subtitle {
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* --- FORMULÁRIO --- */
        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: var(--primary-color);
        }

        /* --- BOTÕES DE OPÇÃO (RADIO) ESTILIZADOS --- */
        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .radio-option {
            flex: 1;
            position: relative;
        }

        .radio-option input {
            display: none; /* Esconde o radio padrão */
        }

        .radio-option label {
            display: block;
            padding: 12px;
            background: #f0f2f5;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: normal;
            border: 2px solid transparent;
        }

        .radio-option input:checked + label {
            background: #eef2ff;
            border-color: var(--primary-color);
            color: var(--primary-color);
            font-weight: bold;
        }

        /* --- BOTÃO DE CALCULAR --- */
        .btn-calc {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
            box-shadow: 0 5px 15px rgba(78, 84, 200, 0.3);
        }

        .btn-calc:hover {
            opacity: 0.9;
        }

        .btn-calc:active {
            transform: scale(0.98);
        }

        /* --- ÁREA DE RESULTADO --- */
        #resultado {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            display: none; /* Escondido inicialmente */
            animation: fadeIn 0.5s ease;
        }

        .valor-final {
            font-size: 28px;
            color: var(--primary-color);
            font-weight: 800;
            margin-top: 5px;
        }

        .detalhes {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsividade para celulares */
        @media (max-width: 400px) {
            .calculator-card {
                padding: 25px;
            }
            .radio-group {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h1>🚚 Calculadora de Frete</h1>
        <p class="subtitle">Simule o custo do seu envio em segundos.</p>

        <div class="input-group">
            <label for="distancia">Distância até o cliente (km)</label>
            <input type="number" id="distancia" placeholder="Ex: 50" min="0">
        </div>

        <div class="input-group">
            <label>Urgência da entrega</label>
            <div class="radio-group">
                <div class="radio-option">
                    <input type="radio" id="nao" name="urgencia" value="nao" checked>
                    <label for="nao">Normal</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="sim" name="urgencia" value="sim">
                    <label for="sim">Urgente / Risco</label>
                </div>
            </div>
        </div>

        <button class="btn-calc" onclick="calcularFrete()">Calcular Frete</button>

        <div id="resultado">
            <div>Custo total do frete:</div>
            <div class="valor-final" id="valorDisplay">R$ 0,00</div>
            <div class="detalhes" id="detalhesDisplay"></div>
        </div>
    </div>

    <script>
        // --- LÓGICA JAVASCRIPT (Adaptada do seu código) ---

        // 1. Definição das constantes
        const TAXA_FIXA = 20.00;
        const VALOR_POR_KM = 1.50;
        const TAXA_EXTRA = 15.00;
        const LIMITE_DISTANCIA = 100;

        function calcularFrete() {
            // 2. Coleta de dados (DOM)
            let inputDistancia = document.getElementById('distancia').value;
            let radioUrgente = document.querySelector('input[name="urgencia"]:checked').value;

            // Validação simples
            if (inputDistancia === "") {
                alert("Por favor, digite a distância em km.");
                return;
            }

            // 3. Tratamento dos dados
            let km = parseFloat(inputDistancia);
            
            // 4. Cálculo do valor base
            let valorBase = TAXA_FIXA + (km * VALOR_POR_KM);

            // 5. Estrutura IF e ELSE
            let valorFinal = 0;
            let mensagemExtra = "";

            if (km > LIMITE_DISTANCIA || radioUrgente === "sim") {
                valorFinal = valorBase + TAXA_EXTRA;
                if (km > LIMITE_DISTANCIA) mensagemExtra += "Distância longa (+R$ 15,00) ";
                if (radioUrgente === "sim") mensagemExtra += "Urgência (+R$ 15,00)";
            } else {
                valorFinal = valorBase;
                mensagemExtra = "Frete padrão";
            }

            // Formatação para moeda brasileira
            let valorFormatado = valorFinal.toFixed(2).replace('.', ',');

            // 6. Exibir resultado na tela
            let divResultado = document.getElementById('resultado');
            let divValor = document.getElementById('valorDisplay');
            let divDetalhes = document.getElementById('detalhesDisplay');

            divValor.innerText = `R$ ${valorFormatado}`;
            divDetalhes.innerText = mensagemExtra;
            
            // Mostrar a div de resultado com animação
            divResultado.style.display = 'block';
        }
    </script>
</body>
</html>
